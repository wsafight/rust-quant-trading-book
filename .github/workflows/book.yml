name: Interactive Book & Rust Engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Astro and TypeScript, verify content, and run web regressions
        run: pnpm run check

      - name: Build interactive site for GitHub Pages
        env:
          SITE_BASE: /rust-quant-trading-book
        run: pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: code

      - name: Check Rust formatting, clippy, and tests
        run: |
          cargo fmt --manifest-path code/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path code/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path code/Cargo.toml --all-features
          cargo bench --locked --manifest-path code/Cargo.toml --no-run

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: code

      - name: Check all companion project targets
        run: cargo check --locked --manifest-path code/Cargo.toml --all-targets --all-features

      - name: Test companion project
        run: cargo test --locked --manifest-path code/Cargo.toml --all-features

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, msrv]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
