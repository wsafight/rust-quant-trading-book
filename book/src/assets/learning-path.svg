<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">从 Rust 入门到量化交易工程师的六阶段路径</title>
  <desc id="desc">六个学习阶段由左向右递进，每阶段通过检查点后进入下一阶段。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
  </defs>
  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="60" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#101828">从语言能力到可审计交易闭环</text>
  <text x="60" y="96" font-family="sans-serif" font-size="17" fill="#475467">每一段都要求代码、测试、解释与可复现证据</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="50" y="145" width="165" height="128" rx="6" fill="#d1fadf" stroke="#16834b" stroke-width="2"/>
    <text x="132" y="181" font-size="18" font-weight="700" fill="#075c35">语言与工程</text>
    <text x="132" y="211" font-size="15" fill="#344054">所有权 · 类型 · 测试</text>
    <text x="132" y="237" font-size="15" fill="#344054">Cargo · 模块边界</text>

    <rect x="238" y="145" width="165" height="128" rx="6" fill="#dff4ff" stroke="#1570a6" stroke-width="2"/>
    <text x="320" y="181" font-size="18" font-weight="700" fill="#105b88">实时系统</text>
    <text x="320" y="211" font-size="15" fill="#344054">L2 · Tokio · 背压</text>
    <text x="320" y="237" font-size="15" fill="#344054">尾延迟 · 可取消</text>

    <rect x="426" y="145" width="165" height="128" rx="6" fill="#fff1c2" stroke="#b77900" stroke-width="2"/>
    <text x="508" y="181" font-size="18" font-weight="700" fill="#7a4f00">市场与产品</text>
    <text x="508" y="211" font-size="15" fill="#344054">微观结构 · 执行</text>
    <text x="508" y="237" font-size="15" fill="#344054">衍生品 · 账务</text>

    <rect x="614" y="145" width="165" height="128" rx="6" fill="#fee4e2" stroke="#d92d20" stroke-width="2"/>
    <text x="696" y="181" font-size="18" font-weight="700" fill="#9f1f17">交易闭环</text>
    <text x="696" y="211" font-size="15" fill="#344054">Adapter · OMS</text>
    <text x="696" y="237" font-size="15" fill="#344054">策略 · 独立硬风控</text>

    <rect x="802" y="145" width="165" height="128" rx="6" fill="#ece9fe" stroke="#6938b8" stroke-width="2"/>
    <text x="884" y="181" font-size="18" font-weight="700" fill="#53309a">研究与生产</text>
    <text x="884" y="211" font-size="15" fill="#344054">回放 · 统计验证</text>
    <text x="884" y="237" font-size="15" fill="#344054">SLO · 故障恢复</text>

    <rect x="990" y="145" width="165" height="128" rx="6" fill="#e4e7ec" stroke="#475467" stroke-width="2"/>
    <text x="1072" y="181" font-size="18" font-weight="700" fill="#344054">项目与职业</text>
    <text x="1072" y="211" font-size="15" fill="#344054">贯穿项目 · 复评</text>
    <text x="1072" y="237" font-size="15" fill="#344054">作品集 · 求职证据</text>
  </g>
  <g stroke="#344054" stroke-width="3" marker-end="url(#arrow)">
    <line x1="215" y1="209" x2="232" y2="209"/>
    <line x1="403" y1="209" x2="420" y2="209"/>
    <line x1="591" y1="209" x2="608" y2="209"/>
    <line x1="779" y1="209" x2="796" y2="209"/>
    <line x1="967" y1="209" x2="984" y2="209"/>
  </g>
  <line x1="132" y1="323" x2="1072" y2="323" stroke="#98a2b3" stroke-width="2"/>
  <g fill="#ffffff" stroke="#344054" stroke-width="2" font-family="sans-serif" text-anchor="middle">
    <circle cx="226" cy="323" r="18"/><text x="226" y="329" font-size="14" fill="#344054" stroke="none">G1</text>
    <circle cx="414" cy="323" r="18"/><text x="414" y="329" font-size="14" fill="#344054" stroke="none">G2</text>
    <circle cx="602" cy="323" r="18"/><text x="602" y="329" font-size="14" fill="#344054" stroke="none">G3</text>
    <circle cx="790" cy="323" r="18"/><text x="790" y="329" font-size="14" fill="#344054" stroke="none">G4</text>
    <circle cx="978" cy="323" r="18"/><text x="978" y="329" font-size="14" fill="#344054" stroke="none">G5</text>
  </g>
  <text x="600" y="382" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475467">检查点失败时回补前置能力；后续功能数量不能代替正确性证据</text>
</svg>
