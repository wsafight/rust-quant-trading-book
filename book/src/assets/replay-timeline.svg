<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">确定性回放事件时间线</title>
  <desc id="desc">市场事件、策略计算、订单到达、市场成交和订单确认按调度时间、优先级和本地序号统一排序。</desc>
  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="55" y="58" font-family="sans-serif" font-size="29" font-weight="700" fill="#101828">Replay：外部事件与内部副作用共享一条虚拟时间线</text>
  <line x1="90" y1="215" x2="1110" y2="215" stroke="#344054" stroke-width="4"/>
  <g stroke="#344054" stroke-width="3">
    <line x1="150" y1="190" x2="150" y2="240"/><line x1="360" y1="190" x2="360" y2="240"/>
    <line x1="570" y1="190" x2="570" y2="240"/><line x1="780" y1="190" x2="780" y2="240"/>
    <line x1="990" y1="190" x2="990" y2="240"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="150" cy="215" r="13" fill="#1570a6"/><circle cx="360" cy="215" r="13" fill="#6938b8"/>
    <circle cx="570" cy="215" r="13" fill="#b77900"/><circle cx="780" cy="215" r="13" fill="#d92d20"/><circle cx="990" cy="215" r="13" fill="#16834b"/>
    <text x="150" y="130" font-size="17" font-weight="700" fill="#105b88">Market delta</text><text x="150" y="157" font-size="14" fill="#475467">本地到达</text>
    <text x="360" y="285" font-size="17" font-weight="700" fill="#53309a">Decision</text><text x="360" y="310" font-size="14" fill="#475467">策略计算完成</text>
    <text x="570" y="130" font-size="17" font-weight="700" fill="#7a4f00">Order arrives</text><text x="570" y="157" font-size="14" fill="#475467">模拟 venue 接受</text>
    <text x="780" y="285" font-size="17" font-weight="700" fill="#9f1f17">Market trade</text><text x="780" y="310" font-size="14" fill="#475467">消耗 queue ahead</text>
    <text x="990" y="130" font-size="17" font-weight="700" fill="#075c35">Order ack</text><text x="990" y="157" font-size="14" fill="#475467">到达 OMS</text>
    <text x="150" y="264" font-size="13" fill="#475467">0 ms</text><text x="360" y="181" font-size="13" fill="#475467">+2 ms</text>
    <text x="570" y="264" font-size="13" fill="#475467">+7 ms</text><text x="780" y="181" font-size="13" fill="#475467">+9 ms</text><text x="990" y="264" font-size="13" fill="#475467">+11 ms</text>
  </g>
  <rect x="255" y="350" width="690" height="48" rx="6" fill="#e4e7ec" stroke="#667085"/>
  <text x="600" y="381" text-anchor="middle" font-family="monospace" font-size="16" fill="#344054">sort key = (scheduled_time, priority, local_sequence)</text>
</svg>
